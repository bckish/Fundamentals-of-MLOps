name: Synthetic fraud model validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/synthetic-fraud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -W error -m unittest -v
      - run: python model.py
      - run: docker build -t synthetic-fraud:ci .
